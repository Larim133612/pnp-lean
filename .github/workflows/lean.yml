name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Forbid sorry
        run: |
          if grep -rnw --include='*.lean' --exclude-dir=Upstream -e 'sorry' -e 'admit' Pnp; then
            echo "sorry/admit found"; exit 1
          fi
      - name: Axiom check
        run: |
          cat > /tmp/Axioms.lean <<'LEAN'
          import Pnp
          #print axioms Pnp.Circuits.shannon_lower_bound
          #print axioms Pnp.Formulas.khrapchenko
          #print axioms Pnp.Formulas.parity_formula_lower_bound
          #print axioms Pnp.Monotone.erdos_rado
          #print axioms Pnp.Monotone.MCircuit.eval_monotone
          #print axioms Pnp.Monotone.approximation_method
          #print axioms Pnp.Monotone.clique_approximation
          #print axioms Pnp.Monotone.not_hasClique_colorGraph
          #print axioms Pnp.Monotone.card_petal_collisions
          #print axioms Pnp.Monotone.card_negErr_pluck
          #print axioms Pnp.Monotone.card_pluck_le
          #print axioms Pnp.Monotone.abAop_posErr
          #print axioms Pnp.Monotone.abAop_negErr
          #print axioms Pnp.Monotone.razborov_alon_boppana_gen
          #print axioms Pnp.Monotone.razborov_alon_boppana
          #print axioms Pnp.Monotone.MForm.exists_circuit
          #print axioms Pnp.Monotone.exists_computesClique
          #print axioms Pnp.Monotone.exists_offDiag_computesClique
          #print axioms Pnp.Monotone.monotone_clique_lower_bound
          #print axioms Pnp.Monotone.exists_circuit_clique_MK
          #print axioms Pnp.Monotone.monotone_clique_superpolynomial
          #print axioms Pnp.AC0.card_sum_eq_zero_mul_two_le
          #print axioms Pnp.AC0.or_step
          #print axioms Pnp.AC0.ac0_approx
          #print axioms Pnp.AC0.Smolensky.smolensky
          #print axioms Pnp.AC0.Smolensky.smolensky_choose
          #print axioms Pnp.AC0.Smolensky.smolensky_tail
          #print axioms Pnp.AC0.choose_half_sq_mul_le
          #print axioms Pnp.AC0.parity_ac0_lower_bound
          #print axioms Pnp.AC0.parity_ac0_lower_bound_of_depth_le
          #print axioms Pnp.AC0.parity_not_in_AC0
          #print axioms Pnp.AC0.exists_parity_formula
          #print axioms Pnp.Circuits.hasMCircuitOfSize_local
          #print axioms Pnp.Circuits.HasMCircuitOfSize.iterate
          #print axioms Pnp.PPoly.stepAux_eq_nf
          #print axioms Pnp.PPoly.outputsInTime_step'
          #print axioms Pnp.PPoly.simulate
          #print axioms Pnp.PPoly.inPPoly_of_inPolynomialTime
          #print axioms Pnp.PPoly.ppoly_of_clayPVersusNP
          #print axioms Pnp.PPoly.negativeBranch_of_not_inPPoly
          #print axioms Pnp.PPoly.exists_not_inPPoly
          #print axioms Pnp.PPoly.inPPoly_true
          #print axioms Pnp.AC0.Circuit.exists_formula
          #print axioms Pnp.AC0.parity_ac0_circuit_lower_bound
          #print axioms Pnp.AC0.parity_not_in_AC0_circuits
          #print axioms Pnp.AC0.exists_parity_circuit
          #print axioms Pnp.Circuits.th2_lower_bound
          #print axioms Pnp.Circuits.not_hasCircuitOfSize_th2
          #print axioms Pnp.Circuits.le_size_of_depends
          #print axioms Pnp.Circuits.th2_hasCircuitOfSize
          #print axioms Pnp.Relativize.runFor_congr
          #print axioms Pnp.Relativize.queries_length_le
          #print axioms Pnp.Relativize.P_subset_NP
          #print axioms Pnp.Relativize.LB_mem_NP
          #print axioms Pnp.Relativize.LB_not_mem_P
          #print axioms Pnp.Relativize.exists_oracle_P_ne_NP
          #print axioms Pnp.Relativize.exists_oracle_P_ssubset_NP
          #print axioms Pnp.Relativize.runFor_congr_short
          #print axioms Pnp.Relativize.queryProg_run
          #print axioms Pnp.Relativize.queryTime_le
          #print axioms Pnp.Relativize.exists_oracle_NP_subset_P
          #print axioms Pnp.Relativize.exists_oracle_P_eq_NP
          #print axioms Pnp.Relativize.baker_gill_solovay
          #print axioms Pnp.Relativize.relativization_barrier
          LEAN
          lake env lean /tmp/Axioms.lean | tee /tmp/axioms.txt
          if grep -v -E 'propext|Classical.choice|Quot.sound' /tmp/axioms.txt | grep -q 'depends on axioms'; then exit 1; fi
          if grep -q 'sorryAx' /tmp/axioms.txt; then exit 1; fi
